<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Runner Battle PRO GOD 🔥</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff00aa">

  <style>
    body { 
      background:#000; 
      color:white; 
      text-align:center; 
      margin:0; 
      font-family:Arial, sans-serif; 
      overflow:hidden; 
    }
    .container { max-width:420px; margin:0 auto; padding:10px; }
    canvas { 
      background: linear-gradient(#0a001f, #1a0033); 
      border-radius:12px; 
      margin:10px auto; 
      display:block; 
      box-shadow:0 0 30px #ff00ff;
    }
    input, button { 
      padding:12px; 
      margin:6px; 
      border-radius:8px; 
      font-size:16px; 
    }
    button { 
      background:#ff00aa; 
      color:white; 
      font-weight:bold; 
    }
    #score { 
      font-size:20px; 
      margin:8px; 
      font-weight:bold; 
      text-shadow:0 0 10px #ff00ff; 
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🏃‍♂️ SUBWAY RUNNER PRO GOD 🔥</h2>
    <input id="username" placeholder="Username" maxlength="15">
    <input id="room" placeholder="Room Code (optional)">
    <button onclick="joinGame()">🚀 START GAME</button>
    <canvas id="game" width="400" height="220"></canvas>
    <div id="score">Score: 0 | Coins: 0</div>
  </div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
// ==================== FIREBASE CONFIG ====================
const firebaseConfig = {
  apiKey: "AIzaSyDnKwEe3HU6GhUP5FYaS-mdOhW6N2DGFGQ",
  authDomain: "game-making-747c0.firebaseapp.com",
  projectId: "game-making-747c0",
  storageBucket: "game-making-747c0.firebasestorage.app",
  messagingSenderId: "54678058247",
  appId: "1:54678058247:web:036525d5d386bed1c8c1a2",
  measurementId: "G-CBHR4JX3LQ"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");

let username = "", room = "";
let running = false;

let player = { x: 180, y: 140, vy: 0, lane: 1, sliding: false, slideTime: 0, animFrame: 0 };
const laneX = [80, 180, 280];

let obstacles = [];
let coins = [];
let powerups = [];
let particles = [];
let score = 0;
let totalCoins = 0;
let speed = 6;
let multiplier = 1;
let magnet = false;
let bgOffset = 0;

let otherPlayers = {};

// Sound
const bgm = new Audio('bgm.mp3');
const gameoverSound = new Audio('gameover.mp3');
bgm.loop = true;

// ==================== JOIN GAME ====================
function joinGame() {
  username = document.getElementById("username").value.trim() || "Runner" + Math.floor(Math.random()*999);
  room = document.getElementById("room").value.trim() || "global" + Math.floor(Math.random()*999);

  running = true;
  bgm.play().catch(() => {});
  listenToPlayers();
  startGame();
}

function startGame() {
  score = 0; 
  totalCoins = 0; 
  speed = 6; 
  multiplier = 1;
  obstacles = []; 
  coins = []; 
  powerups = [];
  player.y = 140;
  gameLoop();
}

// ==================== CONTROLS ====================
let touchStartY = 0;
canvas.addEventListener("touchstart", e => {
  touchStartY = e.touches[0].clientY;
  jump();
});

canvas.addEventListener("touchend", e => {
  if (e.changedTouches[0].clientY - touchStartY > 40) slide();
});

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" && player.lane > 0) player.lane--;
  if (e.key === "ArrowRight" && player.lane < 2) player.lane++;
  if (e.code === "Space") jump();
  if (e.key === "ArrowDown") slide();
});

function jump() {
  if (player.y >= 138 && !player.sliding) {
    player.vy = -13.5;   // Smooth & Slow Jump
  }
}

function slide() {
  if (player.y >= 138 && !player.sliding) {
    player.sliding = true;
    player.slideTime = 40;
  }
}

// ==================== GAME LOOP ====================
function gameLoop() {
  if (!running) return;
  ctx.clearRect(0, 0, 400, 220);

  bgOffset -= speed * 0.6;
  drawBackground();

  // Smooth Lane Change
  player.x += (laneX[player.lane] - player.x) * 0.28;

  // Smooth Jump Physics
  player.vy += 0.65;      // Reduced gravity = smoother jump
  player.y += player.vy;

  if (player.y >= 140) {
    player.y = 140;
    player.vy = 0;
  }

  // Slide Timer
  if (player.slideTime > 0) {
    player.slideTime--;
    if (player.slideTime === 0) player.sliding = false;
  }

  player.animFrame = (player.animFrame + 0.3) % 4;

  drawPlayer();
  updateObstacles();
  updateCoins();
  updatePowerups();
  updateParticles();
  updateMultiplayer();

  // Score & Speed
  score += 0.3 * multiplier;
  if (score % 380 < 0.4) speed += 0.28;

  document.getElementById("score").innerHTML = 
    `Score: ${Math.floor(score)} | Coins: ${totalCoins} ${multiplier>1?'(x'+multiplier+')':''}`;

  requestAnimationFrame(gameLoop);
}

// ==================== BACKGROUND ====================
function drawBackground() {
  ctx.fillStyle = "#220033";
  for (let i = 0; i < 6; i++) {
    let x = (i * 90 + bgOffset * 0.3) % 550 - 50;
    ctx.fillRect(x, 60, 60, 100);
  }
}

// ==================== PLAYER (Animated) ====================
function drawPlayer() {
  ctx.shadowColor = "#00ffff";
  ctx.shadowBlur = 25;

  let legOffset = player.sliding ? 0 : Math.sin(player.animFrame) * 4;
  let bodyY = player.sliding ? 155 : player.y;

  // Body
  ctx.fillStyle = "#00ffff";
  ctx.fillRect(player.x + 4, bodyY, 26, player.sliding ? 18 : 28);

  // Head
  ctx.fillStyle = "#ffdd88";
  ctx.fillRect(player.x + 18, bodyY - 8, 14, 14);

  // Legs
  if (!player.sliding) {
    ctx.fillStyle = "#0088ff";
    ctx.fillRect(player.x + 8, bodyY + 22, 6, 8 + legOffset);
    ctx.fillRect(player.x + 20, bodyY + 22, 6, 8 - legOffset);
  }
  ctx.shadowBlur = 0;
}

// ==================== OBSTACLES ====================
function updateObstacles() {
  for (let o of obstacles) {
    o.x -= speed;
    ctx.fillStyle = o.type === "train" ? "#9900ff" : "#ff3366";
    ctx.fillRect(o.x, o.y, o.width, o.height);

    if (checkCollision(o)) gameOver();
  }
  obstacles = obstacles.filter(o => o.x > -50);

  if (Math.random() < 0.028) {
    let isTrain = Math.random() > 0.55;
    obstacles.push({
      x: 420,
      y: isTrain ? 105 : 145,
      width: isTrain ? 45 : 28,
      height: isTrain ? 55 : 32,
      type: isTrain ? "train" : "barrier"
    });
  }
}

// ==================== COINS ====================
function updateCoins() {
  for (let c of coins) {
    c.x -= speed;
    if (magnet && c.x > player.x) c.x -= 5;

    ctx.fillStyle = "#ffff00";
    ctx.shadowBlur = 20;
    ctx.fillRect(c.x, c.y, 15, 15);
    ctx.shadowBlur = 0;

    if (checkCollision({x:c.x, y:c.y, width:15, height:15})) {
      totalCoins += 10 * multiplier;
      createParticles(c.x, c.y, "#ffff00");
      c.x = -100;
    }
  }
  coins = coins.filter(c => c.x > -50);

  if (Math.random() < 0.045) coins.push({x:420, y:125});
}

// ==================== POWERUPS ====================
function updatePowerups() {
  for (let p of powerups) {
    p.x -= speed;
    ctx.fillStyle = p.type === "magnet" ? "#00ffff" : "#ff00ff";
    ctx.fillRect(p.x, 100, 22, 22);

    if (checkCollision({x:p.x, y:100, width:22, height:22})) {
      if (p.type === "magnet") {
        magnet = true;
        setTimeout(() => magnet = false, 8000);
      } else {
        multiplier = 2;
        setTimeout(() => multiplier = 1, 7000);
      }
      p.x = -100;
    }
  }
  powerups = powerups.filter(p => p.x > -50);

  if (Math.random() < 0.008) {
    powerups.push({x:420, type: Math.random() > 0.5 ? "magnet" : "x2"});
  }
}

function checkCollision(o) {
  let pHeight = player.sliding ? 18 : 32;
  let pY = player.sliding ? 155 : player.y;
  return (
    player.x < o.x + o.width && player.x + 32 > o.x &&
    pY < o.y + o.height && pY + pHeight > o.y
  );
}

function createParticles(x, y, color) {
  for (let i = 0; i < 15; i++) {
    particles.push({x, y, vx: Math.random()*10-5, vy: Math.random()*8-7, life: 22, color});
  }
}

function updateParticles() {
  for (let i = particles.length-1; i >=0; i--) {
    let p = particles[i];
    p.x += p.vx; 
    p.y += p.vy; 
    p.life--;
    ctx.globalAlpha = p.life/22;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 7, 7);
  }
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);
}

// ==================== MULTIPLAYER ====================
function updateMultiplayer() {
  db.ref(`rooms/${room}/positions/${username}`).set({
    x: player.x, 
    y: player.y, 
    score: Math.floor(score)
  });
}

function listenToPlayers() {
  db.ref(`rooms/${room}/positions`).on("value", snap => {
    otherPlayers = snap.val() || {};
  });
}

// ==================== GAME OVER ====================
function gameOver() {
  running = false;
  bgm.pause();
  gameoverSound.play().catch(() => {});
  alert(`💥 CRASHED!\nScore: ${Math.floor(score)}\nCoins: ${totalCoins}`);
}
</script>
</body>
</html>
