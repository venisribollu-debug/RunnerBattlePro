<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runner Battle PRO GOD 🔥</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background: #000;
      color: white;
      text-align: center;
      margin: 0;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }
    h2 { margin: 10px 0 5px; }
    canvas {
      background: linear-gradient(#111, #222);
      border-radius: 12px;
      margin: 10px auto;
      display: block;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }
    input, button {
      padding: 12px;
      margin: 6px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: #00ffcc;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
    #score { font-size: 18px; margin: 10px; font-weight: bold; }
    .container { max-width: 420px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🏃 Runner Battle PRO GOD 🔥</h2>
    
    <input id="username" placeholder="Enter Username" maxlength="15">
    <input id="room" placeholder="Room Code (optional)">
    <button onclick="joinGame()">🚀 START GAME</button>
    
    <br>
    <button onclick="buySkin('red')">🔴 Red Skin (100)</button>
    <button onclick="buySkin('lime')">🟢 Lime Skin (200)</button>
    <button id="installBtn">📱 Install PWA</button>

    <canvas id="game" width="400" height="220"></canvas>
    <div id="score">Score: 0 | Coins: 0 | Rank: Bronze</div>
    <div id="leaderboard" style="margin-top:10px; font-size:14px;"></div>
  </div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
// ==================== FIREBASE CONFIG ====================
const firebaseConfig = {
  apiKey: "AIzaSyDnKwEe3HU6GhUP5FYaS-mdOhW6N2DGFGQ",
  authDomain: "game-making-747c0.firebaseapp.com",
  projectId: "game-making-747c0",
  storageBucket: "game-making-747c0.firebasestorage.app",
  messagingSenderId: "54678058247",
  appId: "1:54678058247:web:036525d5d386bed1c8c1a2",
  measurementId: "G-CBHR4JX3LQ"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ==================== GAME VARIABLES ====================
let canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");
let username = "", room = "";
let running = false;

let player = { x: 180, y: 150, vy: 0, width: 28, height: 28, targetX: 180, color: "cyan" };
let lane = 1;
const laneX = [80, 180, 280];

let obstacles = [];
let coins = [];
let particles = [];

let score = 0;
let totalCoins = 0;
let speed = 5.5;
let baseSpeed = 5.5;

let shield = false;
let magnet = false;
let doubleScore = false;
let speedBoost = false;

let otherPlayers = {};
let leaderboardData = {};

// ==================== JOIN GAME ====================
function joinGame() {
  username = document.getElementById("username").value.trim();
  room = document.getElementById("room").value.trim() || "global_" + Math.floor(Math.random()*999);

  if (!username) return alert("Please enter a username!");

  running = true;
  loadPlayerData();
  startGame();
  listenToPlayers();
  listenToLeaderboard();
}

// ==================== LOAD PLAYER DATA ====================
function loadPlayerData() {
  db.ref("users/" + username).once("value", snap => {
    const data = snap.val() || {};
    if (data.skin) player.color = data.skin;
    totalCoins = data.coins || 0;
  });
}

// ==================== BUY SKIN ====================
function buySkin(color) {
  const cost = color === "red" ? 100 : 200;
  db.ref("users/" + username + "/coins").once("value", snap => {
    let coins = snap.val() || 0;
    if (coins >= cost) {
      db.ref("users/" + username).update({
        coins: coins - cost,
        skin: color
      });
      player.color = color;
      alert("✅ Skin equipped successfully!");
    } else {
      alert("Not enough coins!");
    }
  });
}

// ==================== START GAME ====================
function startGame() {
  score = 0;
  obstacles = [];
  coins = [];
  particles = [];
  speed = baseSpeed;
  player.y = 150;
  player.vy = 0;
  gameLoop();
}

// ==================== CONTROLS ====================
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" && lane > 0) lane--;
  if (e.key === "ArrowRight" && lane < 2) lane++;
  if (e.code === "Space") jump();
});

let touchStartX = 0;
canvas.addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX;
  jump();
});

canvas.addEventListener("touchend", e => {
  let touchEndX = e.changedTouches[0].clientX;
  if (touchEndX - touchStartX > 50 && lane < 2) lane++;
  if (touchStartX - touchEndX > 50 && lane > 0) lane--;
});

function jump() {
  if (player.y >= 148) {
    player.vy = -13;
  }
}

// ==================== GAME LOOP ====================
let lastTime = 0;
function gameLoop(timestamp = 0) {
  if (!running) return;

  const delta = Math.min(timestamp - lastTime, 32);
  lastTime = timestamp;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Update player position (smooth lane change)
  player.targetX = laneX[lane];
  player.x += (player.targetX - player.x) * 0.25;

  // Physics
  player.vy += 0.75;
  player.y += player.vy;
  if (player.y >= 150) {
    player.y = 150;
    player.vy = 0;
  }

  // Draw ground
  ctx.fillStyle = "#333";
  ctx.fillRect(0, 170, 400, 50);

  // Draw Player
  ctx.shadowColor = shield ? "#00ffff" : player.color;
  ctx.shadowBlur = shield ? 25 : 12;
  ctx.fillStyle = player.color;
  ctx.beginPath();
  ctx.roundRect(player.x, player.y, player.width, player.height, 8);
  ctx.fill();
  ctx.shadowBlur = 0;

  updateAndDrawObstacles();
  updateAndDrawCoins();
  updateParticles();

  updateMultiplayer();
  updateUI();

  requestAnimationFrame(gameLoop);
}

// ==================== OBSTACLES ====================
function updateAndDrawObstacles() {
  for (let o of obstacles) {
    o.x -= speed;

    ctx.fillStyle = o.type === "train" ? "#8b00ff" : "#ff0044";
    ctx.fillRect(o.x, o.y, o.width, o.height);

    // Collision
    if (
      player.x < o.x + o.width &&
      player.x + player.width > o.x &&
      player.y < o.y + o.height &&
      player.y + player.height > o.y
    ) {
      if (shield) shield = false;
      else gameOver();
    }
  }
  obstacles = obstacles.filter(o => o.x > -50);
}

// ==================== COINS ====================
function updateAndDrawCoins() {
  for (let c of coins) {
    c.x -= speed;
    if (magnet && c.x > player.x - 40) c.x -= 6;

    ctx.fillStyle = "#ffd700";
    ctx.fillRect(c.x, c.y, 12, 12);

    if (
      player.x < c.x + 12 &&
      player.x + player.width > c.x &&
      player.y < c.y + 12 &&
      player.y + player.height > c.y
    ) {
      let points = doubleScore ? 40 : 20;
      score += points;
      totalCoins += points;
      createParticles(c.x, c.y, "#ffd700");
      c.x = -100;
    }
  }
  coins = coins.filter(c => c.x > -50);
}

// ==================== PARTICLES ====================
function createParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x, y,
      vx: Math.random() * 6 - 3,
      vy: Math.random() * -5 - 2,
      life: 25,
      color
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    p.vy += 0.3;

    ctx.globalAlpha = p.life / 25;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 6, 6);
  }
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);
}

// ==================== MULTIPLAYER & LEADERBOARD ====================
function updateMultiplayer() {
  db.ref(`rooms/${room}/positions/${username}`).set({
    x: player.x,
    y: player.y,
    color: player.color,
    score: Math.floor(score)
  });

  for (let id in otherPlayers) {
    if (id === username) continue;
    let p = otherPlayers[id];
    ctx.fillStyle = p.color || "orange";
    ctx.globalAlpha = 0.7;
    ctx.fillRect(p.x, p.y, 28, 28);
    ctx.globalAlpha = 1;
  }
}

function listenToPlayers() {
  db.ref(`rooms/${room}/positions`).on("value", snap => {
    otherPlayers = snap.val() || {};
  });
}

function listenToLeaderboard() {
  db.ref(`rooms/${room}/positions`).on("value", snap => {
    let data = snap.val() || {};
    let sorted = Object.entries(data)
      .sort((a, b) => (b[1].score || 0) - (a[1].score || 0))
      .slice(0, 5);
    
    let html = "<b>🏆 Room Leaderboard</b><br>";
    sorted.forEach(([name, info], i) => {
      html += `${i+1}. ${name} - ${info.score || 0}<br>`;
    });
    document.getElementById("leaderboard").innerHTML = html;
  });
}

// ==================== UI ====================
function updateUI() {
  score += 0.2;
  let rank = score > 2000 ? "Legend" : score > 1000 ? "Gold" : score > 500 ? "Silver" : "Bronze";

  document.getElementById("score").innerHTML = 
    `Score: ${Math.floor(score)} | Coins: ${Math.floor(totalCoins)} | 🏆 ${rank}`;

  // Power-up spawns
  if (Math.floor(score) % 450 === 0 && !magnet) { magnet = true; setTimeout(() => magnet = false, 5000); }
  if (Math.floor(score) % 650 === 0 && !shield) { shield = true; setTimeout(() => shield = false, 5000); }
  if (Math.floor(score) % 800 === 0 && !speedBoost) {
    speedBoost = true;
    speed = baseSpeed * 1.6;
    setTimeout(() => { speed = baseSpeed; speedBoost = false; }, 6000);
  }
  if (Math.floor(score) % 550 === 0 && !doubleScore) {
    doubleScore = true;
    setTimeout(() => doubleScore = false, 7000);
  }
}

// ==================== SPAWNERS ====================
setInterval(() => {
  if (!running) return;
  let l = Math.floor(Math.random() * 3);
  let isTrain = Math.random() > 0.65;

  obstacles.push({
    x: laneX[l],
    y: isTrain ? 118 : 150,
    width: 28,
    height: isTrain ? 45 : 22,
    type: isTrain ? "train" : "block"
  });
}, 1100);

setInterval(() => {
  if (!running) return;
  let l = Math.floor(Math.random() * 3);
  coins.push({ x: laneX[l], y: 135 });
}, 950);

// ==================== GAME OVER ====================
function gameOver() {
  running = false;
  
  db.ref("users/" + username).update({
    coins: Math.floor(totalCoins),
    bestScore: Math.max(score, 0)
  });

  alert(`💀 Game Over!\nScore: ${Math.floor(score)}\nCoins Earned: ${Math.floor(totalCoins)}`);
}

// ==================== PWA INSTALL ====================
let deferredPrompt;
window.addEventListener("beforeinstallprompt", e => {
  deferredPrompt = e;
});

document.getElementById("installBtn").onclick = () => {
  if (deferredPrompt) deferredPrompt.prompt();
};

// Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
