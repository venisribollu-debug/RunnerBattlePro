<!DOCTYPE html>
<html>
<head>
  <title>Runner Battle PRO GOD 🔥</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <style>
    body { background:#000; color:white; text-align:center; margin:0; font-family:Arial;}
    canvas { background:#222; border-radius:10px; margin-top:10px; }
    button,input { padding:10px; margin:5px; border:none; border-radius:6px; }
  </style>
</head>

<body>

<h2>🏃 Runner Battle PRO GOD LEVEL</h2>

<input id="username" placeholder="Username">
<input id="room" placeholder="Room (leave empty for auto)">
<button onclick="join()">Start</button>

<br>

<button onclick="buySkin('red')">🔴 Skin (100)</button>
<button onclick="buySkin('green')">🟢 Skin (200)</button>

<button id="installBtn">📱 Install</button>

<canvas id="game" width="400" height="200"></canvas>

<div id="score"></div>

<script>

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "YOUR KEY",
  authDomain: "YOUR DOMAIN",
  projectId: "YOUR PROJECT"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// VARIABLES
let username, room;
let canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");

let player = {x:50,y:150,vy:0,jumping:false};
let lane = 1;
let laneX = [80,180,280];

let obstacles = [];
let coins = [];
let otherPlayers = {};

let score = 0;
let totalCoins = 0;
let speed = 5;
let running = false;

let shield = false;
let magnet = false;
let playerColor = "cyan";
let startX = 0;

// JOIN
function join(){
  username = document.getElementById("username").value;
  room = document.getElementById("room").value;

  if(!username) return alert("Enter username");

  if(!room){
    room = "room" + Math.floor(Math.random()*1000);
  }

  running = true;

  giveDailyReward();
  listenPlayers();
  startGame();
}

// DAILY REWARD
function giveDailyReward(){
  let today = new Date().toDateString();

  db.ref("users/"+username+"/lastReward").once("value", snap=>{
    if(snap.val() !== today){
      db.ref("users/"+username+"/coins")
        .transaction(c => (c||0)+100);

      db.ref("users/"+username+"/lastReward").set(today);
      alert("🎁 +100 Daily Coins!");
    }
  });
}

// START
function startGame(){
  score = 0;
  totalCoins = 0;
  obstacles = [];
  coins = [];
  gameLoop();
}

// CONTROLS
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft" && lane>0) lane--;
  if(e.key==="ArrowRight" && lane<2) lane++;
  if(e.code==="Space") jump();
});

canvas.addEventListener("click", jump);

canvas.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});
canvas.addEventListener("touchend", e=>{
  let endX = e.changedTouches[0].clientX;
  if(endX-startX>50 && lane<2) lane++;
  if(startX-endX>50 && lane>0) lane--;
});

// JUMP
function jump(){
  if(!player.jumping){
    player.vy = -10;
    player.jumping = true;
  }
}

// GAME LOOP
function gameLoop(){
  if(!running) return;

  ctx.clearRect(0,0,400,200);

  player.x = laneX[lane];

  player.y += player.vy;
  player.vy += 0.8;
  if(player.y>=150){ player.y=150; player.jumping=false; }

  ctx.shadowColor = shield ? "cyan" : "transparent";
  ctx.shadowBlur = shield ? 20 : 0;
  ctx.fillStyle = playerColor;
  ctx.fillRect(player.x,player.y,20,20);

  // MULTIPLAYER
  db.ref("rooms/"+room+"/positions/"+username).set({
    x:player.x,y:player.y
  });

  for(let p in otherPlayers){
    if(p!==username){
      let op = otherPlayers[p];
      ctx.fillStyle="orange";
      ctx.fillRect(op.x,op.y,20,20);
      ctx.fillText(p,op.x,op.y-5);
    }
  }

  // OBSTACLES
  obstacles.forEach(o=>{
    o.x -= speed;

    ctx.fillStyle = o.type==="train" ? "purple" : "red";
    ctx.fillRect(o.x,o.y,o.width,o.height);

    if(player.x < o.x+o.width &&
       player.x+20 > o.x &&
       player.y < o.y+o.height){

      if(shield){ shield=false; }
      else gameOver();
    }
  });

  obstacles = obstacles.filter(o=>o.x>-50);

  // COINS
  coins.forEach(c=>{
    c.x -= speed;

    if(magnet && c.x > player.x) c.x -= 3;

    ctx.fillStyle="yellow";
    ctx.fillRect(c.x,c.y,10,10);

    if(player.x < c.x+10 &&
       player.x+20 > c.x &&
       player.y < c.y+10){

      score += 20;
      totalCoins += 20;
      c.x = -100;
    }
  });

  coins = coins.filter(c=>c.x>-50);

  // POWERS
  if(score%300===0 && score>0){
    magnet=true;
    setTimeout(()=>magnet=false,4000);
  }

  if(score%500===0 && score>0){
    shield=true;
    setTimeout(()=>shield=false,4000);
  }

  score++;

  // RANK
  let rank="Bronze";
  if(score>500) rank="Silver";
  if(score>1000) rank="Gold";
  if(score>2000) rank="Legend";

  document.getElementById("score").innerHTML =
    `Score:${score} | Coins:${totalCoins} | 🏆 ${rank}`;

  requestAnimationFrame(gameLoop);
}

// SPAWN
setInterval(()=>{
  if(running){
    let laneR=Math.floor(Math.random()*3);
    let isTrain=Math.random()>0.6;

    obstacles.push({
      x:laneX[laneR],
      y:isTrain?120:150,
      width:20,
      height:isTrain?40:20,
      type:isTrain?"train":"block"
    });
  }
},1200);

setInterval(()=>{
  if(running){
    let laneR=Math.floor(Math.random()*3);
    coins.push({x:laneX[laneR],y:140});
  }
},1000);

// GAME OVER
function gameOver(){
  running=false;

  db.ref("users/"+username+"/coins")
    .transaction(c=>(c||0)+totalCoins);

  db.ref("users/"+username+"/rank").set(getRank());

  alert("💀 Game Over!");
}

// RANK FUNC
function getRank(){
  if(score>2000) return "Legend";
  if(score>1000) return "Gold";
  if(score>500) return "Silver";
  return "Bronze";
}

// MULTIPLAYER
function listenPlayers(){
  db.ref("rooms/"+room+"/positions").on("value", snap=>{
    otherPlayers = snap.val() || {};
  });
}

// SKINS
function buySkin(color){
  let cost=color==="red"?100:200;

  db.ref("users/"+username+"/coins").once("value", snap=>{
    let c=snap.val()||0;

    if(c>=cost){
      db.ref("users/"+username+"/coins").set(c-cost);
      playerColor=color;
      alert("Skin equipped!");
    } else alert("Not enough coins");
  });
}

// INSTALL
let deferredPrompt;
window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  deferredPrompt=e;
});

document.getElementById("installBtn").onclick=()=>{
  if(deferredPrompt) deferredPrompt.prompt();
};
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("🔥 PWA Ready"))
    .catch(err => console.log(err));
}
</script>

</body>
</html>
